<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Management API</title>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #fff;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #666;
      font-size: 0.8rem;
      margin: 0.25rem 0;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      border: 1px solid #ccc;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      color: green;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Loan Management API</h1>
    <p>REST API is up and running.</p>
    <div class="badge">● Server Online</div>
  </div>

</html>
